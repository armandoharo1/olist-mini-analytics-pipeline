services:
  postgres:                          # nombre del servicio (Metabase lo usa como "host")
    image: postgres:16
    container_name: olist_postgres
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:v0.64.2     # versión fija para que sea reproducible
    container_name: olist_metabase
    ports:
      - "3500:3000"                      # Metabase en http://localhost:3000
    environment:
      MB_DB_FILE: /metabase-data/metabase.db   # dónde guarda sus dashboards
    volumes:
      - metabase-data:/metabase-data           # ... dentro de un volumen persistente
    depends_on:
      - postgres                         # arranca después de Postgres

volumes:
  pgdata:
  metabase-data:
version: 2

# Curated layer: business-ready tables that answer the assignment questions.
models:
  - name: mtr_monthly_sales
    description: "(a) Revenue by month and (b) AOV trend. Revenue = items + freight of valid orders (BRL). Use is_complete_month = true for trend charts."
    columns:
      - name: month_start
        data_tests: [unique, not_null]
      - name: revenue
        data_tests: [not_null]

  - name: mtr_repeat_purchase
    description: "(c) Repeat-purchase rate: % of customers (customer_unique_id) with 2+ valid orders."
    columns:
      - name: repeat_purchase_rate_pct
        data_tests: [not_null]

  - name: mtr_category_sales
    description: "(d) Revenue by product category (English), ranked. Revenue = item price + freight of valid items."
    columns:
      - name: category_name
        data_tests: [unique, not_null]

  - name: mtr_delivery_performance
    description: "(e) Delivery: on-time rate, average delivery days and review score on-time vs late, by month of purchase."
    columns:
      - name: month_start
        data_tests: [unique, not_null]
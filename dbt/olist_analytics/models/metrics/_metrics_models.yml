version: 2

models:
  - name: mtr_monthly_sales
    description: "Revenue and AOV by month. Use is_complete_month for trends."
    columns:
      - name: month_start
        data_tests: [unique, not_null]
      - name: revenue
        data_tests: [not_null]

  - name: mtr_repeat_purchase
    description: "Repeat-purchase rate (2+ valid orders) and strict rate (2+ purchase days)."
    columns:
      - name: repeat_purchase_rate_pct
        data_tests: [not_null]

  - name: mtr_category_sales
    description: "Revenue by product category, ranked."
    columns:
      - name: category_name
        data_tests: [unique, not_null]

  - name: mtr_delivery_performance
    description: "On-time rate, delivery days and review score (on time vs late) by month."
    columns:
      - name: month_start
        data_tests: [unique, not_null]

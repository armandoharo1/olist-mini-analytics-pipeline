version: 2

models:
  - name: dim_products
    description: "One row per product, with the category name in English."
    columns:
      - name: product_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: category_name
        description: "English category. 'unknown' if the product has no category; Portuguese name if there is no translation."
        data_tests: [not_null]

  - name: dim_sellers
    description: "One row per seller."
    columns:
      - name: seller_id
        description: "Primary key."
        data_tests: [unique, not_null]

  - name: dim_customers
    description: "One row per real customer (customer_unique_id). Location is taken from the most recent order."
    columns:
      - name: customer_unique_id
        description: "Primary key. Identifies the person across orders."
        data_tests: [unique, not_null]
      - name: first_purchase_at
        data_tests: [not_null]

  - name: dim_date
    description: "Calendar table: one row per day from 2016-01-01 to 2018-12-31."
    columns:
      - name: date_day
        description: "Primary key."
        data_tests: [unique, not_null]

  - name: fct_order_items
    description: "One row per item sold within an order. Measures in BRL. Use is_valid_sale to filter revenue."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [order_id, order_item_id]}
    columns:
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_products'), field: product_id}
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_sellers'), field: seller_id}
      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customers'), field: customer_unique_id}
      - name: purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: is_valid_sale
        description: "False for canceled and unavailable orders (see macros/is_valid_sale.sql)."
        data_tests: [not_null]
      - name: item_total
        description: "item_price + freight_value"
        data_tests: [not_null]

  
  - name: fct_orders
    description: "One row per order. order_total (items + freight) is the revenue definition. Use is_valid_sale to filter."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customers'), field: customer_unique_id}
      - name: purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: is_valid_sale
        description: "False for canceled and unavailable orders (see macros/is_valid_sale.sql)."
        data_tests: [not_null]
      - name: order_total
        description: "Revenue of the order: products_value + freight_value (BRL). 0 if the order has no items."
        data_tests: [not_null]
      - name: review_score
        description: "Score (1-5) of the most recent review. NULL if the order has no review."
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5], quote: false}
      - name: is_late
        description: "True if delivered after the estimated date. NULL if not delivered."
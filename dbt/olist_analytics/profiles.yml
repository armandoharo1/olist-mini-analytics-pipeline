olist_analytics:             
  target: dev                 # entorno que se usa por defecto
  outputs:
    dev:
      type: postgres          # usa el adaptador dbt-postgres
      host: localhost         
      port: 5432
      user: olist            
      password: olist
      dbname: olist
      schema: analytics       # esquema por defecto donde dbt crea tablas/vistas
      threads: 4              # cuántos modelos puede crear en paralelo
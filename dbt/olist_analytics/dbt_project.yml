name: 'olist_analytics'
version: '1.0.0'

profile: 'olist_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  olist_analytics:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    reconciliation:
      +schema: reconciliation
      +materialized: table
    metrics:
      +schema: metrics
      +materialized: table

vars:
  # Months with complete data; trend charts use only this window.
  first_complete_month: '2017-01-01'
  last_complete_month: '2018-08-01'
